[project]
name = "knowledgepilot-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "openai>=3.26.1",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff.format]
# Keep hand-aligned code examples in docs as written.
exclude = ["*.md"]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = [
    "live: calls the real LLM provider (costs money; run with `make test-live`)",
]
