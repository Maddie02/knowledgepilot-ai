# Lint, format-check, type-check and test with the same tools and locked
# dependencies used locally (`make check` runs the same steps).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job name `test` is a required status check on `main`; rename it there too.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        # setup-uv publishes no floating major tags; pinned to a commit SHA for v10.3.2.
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        # Python version comes from .python-version; --locked fails if uv.lock is stale.
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check . --output-format=github

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test with coverage
        # Tests always use the mock LLM; `live` tests are excluded via pyproject.toml.
        # Fails if coverage drops below fail_under in pyproject.toml.
        run: >-
          uv run python -m pytest
          --cov --cov-report=term
          --cov-report=markdown-append:$GITHUB_STEP_SUMMARY
