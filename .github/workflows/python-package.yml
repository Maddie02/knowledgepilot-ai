# Lint and test with the same tools and locked dependencies used locally (see Makefile).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        # setup-uv publishes no floating major tags; pinned to a commit SHA for v10.3.2.
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        # Python version comes from .python-version; --locked fails if uv.lock is stale.
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test
        # Tests always use the mock LLM; `live` tests are excluded via pyproject.toml.
        run: uv run python -m pytest
